<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>TAHA HESARAKI WORKSPACE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='24' fill='%23101827'/%3E%3Cpath d='M48 12 80 30v36L48 84 16 66V30z' fill='none' stroke='%2358def5' stroke-width='5'/%3E%3C/svg%3E">
<style>
:root{--bg:#080b12;--p:#111a27;--p2:#172232;--line:#94b0d022;--c:#58def5;--v:#a78bfa;--t:#edf4fb;--m:#8d9daf;font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-size:14px}.shell{display:flex;min-height:100vh}.side{width:245px;flex-shrink:0;padding:24px 16px;background:#0c111bef;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{padding:0 10px 25px;font-weight:800;letter-spacing:2px}.brand small{display:block;color:var(--c);font-size:9px;letter-spacing:4px}.side label{font-size:9px;color:#637387;letter-spacing:1.5px}.side select,.field{background:var(--p2);border:1px solid var(--line);border-radius:9px;color:var(--t);padding:10px;min-width:0}.nav{display:flex;width:100%;gap:12px;padding:11px;margin:4px 0;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--m);text-align:left}.nav.active{background:#58def51a;border-color:#58def533;color:var(--t)}.nav i{color:var(--c);font-style:normal}.bottom{margin-top:auto;color:var(--m);font-size:10px;border-top:1px solid var(--line);padding-top:15px}.dot{display:inline-block;width:7px;height:7px;background:#56d6a2;border-radius:50%;margin-right:7px}main{flex:1;min-width:0;padding:0 32px;display:flex;flex-direction:column}.top{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.top small{display:block;color:var(--m);margin-top:5px}.actions{display:flex;gap:8px;align-items:center}.btn,.primary,.secondary,.danger{border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:var(--p2);color:var(--t);font-size:11px;cursor:pointer}.primary{background:linear-gradient(110deg,#56dff4,#7faeff);color:#07131b;border:0;font-weight:700}.danger{color:#ff7887}.view{padding:28px 0;flex:1;max-width:1400px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px}.kicker{color:var(--c);font-size:9px;letter-spacing:2px}.head h1{font-size:clamp(24px,3vw,32px);margin:8px 0}.head p,.hint{color:var(--m);font-size:11px;line-height:1.7;margin:0}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:15px}.stat,.panel,.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#131c2af0,#0d131df0);padding:17px;min-width:0}.stat{min-height:100px;color:var(--m);font-size:10px}.num{display:block;color:var(--t);font-size:27px;margin-top:12px}.dash{grid-template-columns:1.3fr 1fr}.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row strong,.row small{display:block}.row small{color:var(--m);margin-top:4px}.grow{flex:1;min-width:0}.track{height:5px;background:#8197ae22;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--c),var(--v))}.form{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;padding:12px;background:var(--p2);border-radius:10px}.form .field{flex:1}.field{width:100%;font-size:11px}.cards{grid-template-columns:repeat(2,1fr)}.card h3{font-size:13px}.tag{color:var(--c);font-size:9px}.task{display:flex;gap:9px;padding:10px 0;border-top:1px solid var(--line);font-size:11px}.task.done span{text-decoration:line-through;color:#637387}.editorgrid{grid-template-columns:1fr 1fr}.editor{width:100%;min-height:380px;background:#0b111c;color:#c8def5;border:0;padding:15px;font:11px/1.7 monospace}.preview{width:100%;min-height:380px;border:0;background:white}.file{display:flex;align-items:center;gap:10px;margin-top:8px;padding:11px;background:var(--p2);border:1px solid var(--line);border-radius:10px}.file .grow{overflow:hidden}.file small{display:block;color:var(--m)}.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:11px}.toast{position:fixed;bottom:18px;right:18px;padding:12px 16px;background:#172436;border:1px solid #58def555;border-radius:10px}html[dir=rtl]{font-family:Tahoma,system-ui,sans-serif}html[dir=rtl] .side{border-right:0;border-left:1px solid var(--line)}html[dir=rtl] .nav{text-align:right}html[dir=rtl] .toast{right:auto;left:18px}@media(max-width:850px){.side{width:205px}main{padding:0 18px}.stats{grid-template-columns:repeat(2,1fr)}.dash,.editorgrid{grid-template-columns:1fr}}@media(max-width:650px){.shell{display:block}.side{width:auto;min-height:0;padding:13px;display:block}.brand{padding:0 5px 10px}.side label,.bottom{display:none}.side nav{display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}.side select,.side .field{display:none}main{padding:0 13px}.top{height:65px}.head{align-items:start;flex-direction:column}.cards{grid-template-columns:1fr}.editor,.preview{min-height:280px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">◇ TAHA HESARAKI<small>N E X U S</small></div><label>فضای کاری</label><div class="form"><select id="workspace" class="field"></select><button class="btn" id="newws">＋</button></div><nav><button class="nav active" data-page="dashboard"><i>◈</i>داشبورد</button><button class="nav" data-page="projects"><i>▦</i>پروژه‌ها</button><button class="nav" data-page="studio"><i>⌘</i>محیط کدنویسی</button><button class="nav" data-page="files"><i>▤</i>مدیریت فایل‌ها</button><button class="nav" data-page="analytics"><i>⌁</i>گزارش‌ها</button></nav><div class="bottom"><span class="dot"></span>ذخیره‌سازی محلی<br><br>اطلاعات در همین مرورگر و دستگاه باقی می‌ماند</div></aside><main><header class="top"><div><b>طاها حصارکی / <span id="section">داشبورد</span></b><small>محیط کاری شخصی</small></div><div class="actions"><button class="btn" id="backup">⇩ پشتیبان‌گیری</button></div></header><section class="view" id="view">Loading TAHA HESARAKI…</section><footer class="hint">ابزار شخصی طاها حصارکی • نسخه ۱٫۰</footer></main></div><div id="toast"></div><input id="importer" type="file" accept=".json,.txt,.md,.csv" hidden>
<script>
/* Embedded database.js: IndexedDB with localStorage fallback */
const DB="taha-personal-workspace-db",TABLES=["workspaces","projects","tasks","files","snippets"],FALL="taha-workspace-fallback-v1";let dbPromise;
function db(){if(!("indexedDB"in window))return Promise.reject();if(!dbPromise)dbPromise=new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>TABLES.forEach(t=>{if(!r.result.objectStoreNames.contains(t))r.result.createObjectStore(t,{keyPath:"id"})});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});return dbPromise}
function fallback(){try{return JSON.parse(localStorage.getItem(FALL)||"{}")}catch{return {}}}
async function getAll(t){try{let d=await db();return await new Promise((ok,no)=>{let r=d.transaction(t).objectStore(t).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}catch{return fallback()[t]||[]}}
async function put(t,x){x={...x,updatedAt:new Date().toISOString()};try{let d=await db();await new Promise((ok,no)=>{let r=d.transaction(t,"readwrite").objectStore(t).put(x);r.onsuccess=ok;r.onerror=()=>no(r.error)})}catch{let a=fallback();a[t]??=[];let i=a[t].findIndex(y=>y.id===x.id);i<0?a[t].push(x):a[t][i]=x;localStorage.setItem(FALL,JSON.stringify(a))}return x}
async function remove(t,id){try{let d=await db();await new Promise((ok,no)=>{let r=d.transaction(t,"readwrite").objectStore(t).delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)})}catch{let a=fallback();a[t]=(a[t]||[]).filter(x=>x.id!==id);localStorage.setItem(FALL,JSON.stringify(a))}}
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID?.()||"nx"+Date.now()+Math.random(),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const words={en:{dash:"Your workspace, in focus.",sub:"A clear view of what you are building and what deserves attention next.",projects:"Build with intention.",projectsub:"Track ideas, active work and milestones in one place.",studio:"A lightweight coding desk.",studiosub:"Draft HTML, CSS and JavaScript and preview it in an isolated frame.",files:"Your files, organized.",filessub:"Create local notes, import text files and download them when needed.",analytics:"Make progress visible.",settings:"Make TAHA HESARAKI yours.",newproject:"＋ New project",name:"Project name",desc:"Short description (optional)",create:"Create project",progress:"Progress",planned:"Planned",active:"In progress",paused:"Paused",completed:"Completed",delete:"Delete",noDesc:"No description added yet.",save:"Save snippet",download:"Download",run:"Run preview",live:"LIVE PREVIEW",newfile:"New file",filename:"File name",content:"Start writing something useful…",import:"Import file",backup:"Export full backup",restore:"Restore backup",clear:"Clear current workspace",local:"Each workspace is stored in this browser on this device. No cloud sync or shared login.",privacy:"No account, server or API key is used.",task:"What needs to get done?",tasks:"Task board",quick:"Quick launch",total:"Total projects",activeCount:"Active projects",done:"Tasks completed",stored:"Stored files",completeRate:"Task completion",language:"Interface language",appearance:"Appearance",dark:"Dark futuristic",light:"Light"},
fa:{dash:"همه‌چیز، یک‌جا و شفاف.",sub:"نمایی روشن از پروژه‌هایی که می‌سازید و قدم بعدی شما.",projects:"با هدفمندی بسازید.",projectsub:"ایده‌ها و کارهای در حال انجام را یک‌جا مدیریت کنید.",studio:"میز کار کدنویسی.",studiosub:"کدهای HTML، CSS و JavaScript را بنویسید و پیش‌نمایش بگیرید.",files:"فایل‌هایتان، مرتب و در دسترس.",filessub:"یادداشت بسازید، فایل متنی وارد کنید و دریافت کنید.",analytics:"پیشرفت را قابل مشاهده کنید.",settings:"TAHA HESARAKI را مطابق سلیقه‌تان تنظیم کنید.",newproject:"＋ پروژهٔ جدید",name:"نام پروژه",desc:"توضیح کوتاه (اختیاری)",create:"ساخت پروژه",progress:"پیشرفت",planned:"برنامه‌ریزی‌شده",active:"در حال انجام",paused:"متوقف‌شده",completed:"تکمیل‌شده",delete:"حذف",noDesc:"توضیحی ثبت نشده است.",save:"ذخیرهٔ قطعه‌کد",download:"دریافت فایل",run:"اجرای پیش‌نمایش",live:"پیش‌نمایش زنده",newfile:"فایل جدید",filename:"نام فایل",content:"نوشتن را از اینجا شروع کنید…",import:"واردکردن فایل",backup:"خروجی پشتیبان کامل",restore:"بازیابی پشتیبان",clear:"پاک‌سازی فضای فعلی",local:"هر فضای کاری فقط در مرورگر همین دستگاه ذخیره می‌شود و همگام‌سازی ابری ندارد.",privacy:"هیچ حساب کاربری، سرور یا کلید API استفاده نمی‌شود.",task:"چه کاری باید انجام شود؟",tasks:"تابلوی وظایف",quick:"دسترسی سریع",total:"مجموع پروژه‌ها",activeCount:"پروژه‌های فعال",done:"کارهای انجام‌شده",stored:"فایل‌های ذخیره‌شده",completeRate:"درصد تکمیل وظایف",language:"زبان رابط کاربری",appearance:"ظاهر برنامه",dark:"تیرهٔ آینده‌نگر",light:"روشن"}};
let lang="fa",wid=localStorage.getItem("nx-workspace")||"",page="dashboard",code=sessionStorage.getItem("nx-code")||`<!doctype html><html><body style="font:20px system-ui;padding:2rem;background:#0d1725;color:white"><h1>سلام!</h1><p>کد خودت را از اینجا شروع کن.</p></body></html>`;
const t=k=>words.fa[k]||k,notify=s=>{$("#toast").className="toast";$("#toast").textContent=s;setTimeout(()=>$("#toast").textContent="",2500)},all=async table=>(await getAll(table)).filter(x=>!x.workspaceId||x.workspaceId===wid);
async function initWorkspaces(){let a=await getAll("workspaces");if(!a.length){for(let name of ["Personal","Development","NEON OVERDRIVE","AI Research"])await put("workspaces",{id:uid(),name});a=await getAll("workspaces")}if(!a.some(x=>x.id===wid))wid=a[0].id;localStorage.setItem("nx-workspace",wid);$("#workspace").innerHTML=a.map(x=>`<option value="${x.id}" ${x.id===wid?"selected":""}>${esc(x.name)}</option>`).join("")}
function head(k,p,extra=""){return `<div class="head"><div><div class="kicker">WORKSPACE / ${page.toUpperCase()}</div><h1>${k}</h1><p>${p}</p></div>${extra}</div>`}
async function render(){let [ps,ts,fs]=await Promise.all([all("projects"),all("tasks"),all("files")]),h="";
if(page==="dashboard"){h=head(t("dash"),t("sub"),`<button class="primary" data-page="projects">${t("newproject")}</button>`)+`<div class="grid stats"><div class="stat">${t("total")}<b class="num">${ps.length}</b></div><div class="stat">${t("activeCount")}<b class="num">${ps.filter(x=>x.status==="active").length}</b></div><div class="stat">${t("done")}<b class="num">${ts.filter(x=>x.done).length}</b></div><div class="stat">${t("stored")}<b class="num">${fs.length}</b></div></div><div class="grid dash"><section class="panel"><h3>◈ ${t("projects")}</h3>${ps.slice(0,6).map(p=>`<div class="row"><div class="grow"><strong>${esc(p.name)}</strong><small>${esc(p.description||t("noDesc"))}</small></div><div style="width:90px"><div class="track"><div class="fill" style="width:${p.progress||0}%"></div></div><small>${p.progress||0}%</small></div></div>`).join("")||'<p class="hint">هنوز پروژه‌ای ثبت نشده است.</p>'}</section><section class="panel"><h3>${t("quick")}</h3><button class="btn" data-page="studio">⌘ Code Studio</button> <button class="btn" data-page="files">▤ File Manager</button><h3>${t("tasks")}</h3><form id="taskform" class="form"><input class="field" name="title" placeholder="${t("task")}" required><button class="primary">＋</button></form>${ts.map(x=>`<label class="task ${x.done?"done":""}"><input type="checkbox" data-task="${x.id}" ${x.done?"checked":""}><span>${esc(x.title)}</span></label>`).join("")}</section></div>`}
if(page==="projects"){h=head(t("projects"),t("projectsub"))+`<form id="projectform" class="form"><input class="field" name="name" placeholder="${t("name")}" required><input class="field" name="description" placeholder="${t("desc")}"><button class="primary">${t("create")}</button></form><div class="grid cards">${ps.map(p=>`<article class="card"><span class="tag">${t(p.status||"planned")}</span><h3>${esc(p.name)}</h3><p class="hint">${esc(p.description||t("noDesc"))}</p><div class="track"><div class="fill" style="width:${p.progress||0}%"></div></div><p class="hint">${t("progress")}: ${p.progress||0}%</p><select class="field" data-status="${p.id}"><option value="planned">برنامه‌ریزی‌شده</option><option value="active" ${p.status==="active"?"selected":""}>در حال انجام</option><option value="paused">متوقف‌شده</option><option value="completed">تکمیل‌شده</option></select> <button class="danger" data-delete="projects" data-id="${p.id}">${t("delete")}</button></article>`).join("")}</div>`}
if(page==="studio"){h=head(t("studio"),t("studiosub"),`<div><button class="secondary" data-action="savecode">${t("save")}</button> <button class="secondary" data-action="downloadcode">${t("download")}</button> <button class="primary" data-action="run">${t("run")}</button></div>`)+`<div class="grid editorgrid"><section class="panel"><div class="hint">⌘ experiment.html · HTML / CSS / JS</div><textarea id="editor" class="editor" spellcheck="false">${esc(code)}</textarea></section><section class="panel"><div class="hint">${t("live")}</div><iframe id="preview" class="preview" sandbox="allow-scripts"></iframe></section></div>`}
if(page==="files"){h=head(t("files"),t("filessub"))+`<section class="panel"><form id="fileform" class="form"><input class="field" name="name" placeholder="${t("filename")}" required><textarea class="field" name="content" placeholder="${t("content")}" rows="4"></textarea><button class="primary">${t("newfile")}</button></form><button class="secondary" data-action="import">${t("import")}</button>${fs.map(f=>`<div class="file"><div class="grow"><b>${esc(f.name)}</b><small>${new Date(f.updatedAt||f.createdAt).toLocaleString()}</small></div><button class="btn" data-downloadfile="${f.id}">${t("download")}</button><button class="danger" data-delete="files" data-id="${f.id}">${t("delete")}</button></div>`).join("")}</section>`}
if(page==="analytics"){let done=ts.filter(x=>x.done).length,rate=ts.length?Math.round(done/ts.length*100):0,avg=ps.length?Math.round(ps.reduce((a,p)=>a+(+p.progress||0),0)/ps.length):0;h=head(t("analytics"),"گزارش فضای کاری")+`<div class="grid stats"><div class="stat">${t("completeRate")}<b class="num">${rate}%</b></div><div class="stat">${t("progress")}<b class="num">${avg}%</b></div><div class="stat">پروژه‌های تکمیل‌شده<b class="num">${ps.filter(x=>x.status==="completed").length}</b></div><div class="stat">${t("stored")}<b class="num">${fs.length}</b></div></div>`}
if(page==="settings"){h=head("پشتیبان‌گیری","مدیریت نسخه پشتیبان و اطلاعات محلی.")+`<div class="grid"><section class="panel"><button class="secondary" data-action="backup">${t("download")}</button> <button class="secondary" data-action="restore">${t("restore")}</button><div class="setting">${t("clear")}<button class="danger" data-action="clear">${t("delete")}</button></div><p class="hint">${t("local")}</p><p class="hint">${t("privacy")}</p></section></div>`}
$("#view").innerHTML=h;$("#section").textContent=page[0].toUpperCase()+page.slice(1);document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===page));if(page==="studio")run(false)}
function go(p){page=p;render()}
function download(name,data,type="text/plain;charset=utf-8"){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
async function backup(){let data={};for(let t of TABLES)data[t]=await getAll(t);download("taha-workspace-backup.json",JSON.stringify({format:"nexoria-nexus-backup",version:1,data},null,2),"application/json")}
function run(show=true){let e=$("#editor"),f=$("#preview");if(!f)return;if(e){code=e.value;sessionStorage.setItem("nx-code",code)}f.srcdoc=code;if(show)notify("پیش‌نمایش به‌روزرسانی شد")}
document.addEventListener("click",async e=>{let p=e.target.closest("[data-page]");if(p){go(p.dataset.page);return}let a=e.target.closest("[data-action]")?.dataset.action;if(a==="run")run();if(a==="savecode")await put("snippets",{id:uid(),workspaceId:wid,name:"قطعه‌کد محیط کدنویسی",code:$("#editor").value});if(a==="downloadcode")download("taha-experiment.html",$("#editor").value,"text/html");if(a==="backup")await backup();if(a==="restore"||a==="import"){$("#importer").dataset.mode=a;$("#importer").click()}if(a==="clear"&&confirm("همه اطلاعات این فضای کاری حذف شود؟")){for(let t of ["projects","tasks","files","snippets"])for(let x of await all(t))await remove(t,x.id);render()}let del=e.target.closest("[data-delete]");if(del&&confirm("این مورد حذف شود؟")){await remove(del.dataset.delete,del.dataset.id);render()}let f=e.target.closest("[data-downloadfile]");if(f){let x=(await all("files")).find(y=>y.id===f.dataset.downloadfile);if(x)download(x.name,x.content||"")}});
document.addEventListener("submit",async e=>{e.preventDefault();let d=new FormData(e.target);if(e.target.id==="projectform")await put("projects",{id:uid(),workspaceId:wid,name:String(d.get("name")).trim(),description:String(d.get("description")||""),status:"active",progress:0,createdAt:new Date().toISOString()});if(e.target.id==="taskform")await put("tasks",{id:uid(),workspaceId:wid,title:String(d.get("title")).trim(),done:false,createdAt:new Date().toISOString()});if(e.target.id==="fileform"){let name=String(d.get("name")).trim();await put("files",{id:uid(),workspaceId:wid,name:name.includes(".")?name:name+".txt",content:String(d.get("content")||""),createdAt:new Date().toISOString()})}render()});
document.addEventListener("change",async e=>{let n=e.target;if(n.id==="workspace"){wid=n.value;localStorage.setItem("nx-workspace",wid);render()}if(n.dataset.task){let x=(await all("tasks")).find(x=>x.id===n.dataset.task);if(x){x.done=n.checked;await put("tasks",x);render()}}if(n.dataset.status){let x=(await all("projects")).find(x=>x.id===n.dataset.status);if(x){x.status=n.value;if(n.value==="completed")x.progress=100;await put("projects",x);render()}}});
$("#backup").onclick=backup;$("#newws").onclick=async()=>{let name=prompt("نام فضای کاری");if(name?.trim()){let x=await put("workspaces",{id:uid(),name:name.trim()});wid=x.id;await initWorkspaces();render()}};$("#importer").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let txt=await f.text();if(e.target.dataset.mode==="restore"){let p=JSON.parse(txt);if(p.format!=="nexoria-nexus-backup")throw Error("فایل پشتیبان معتبر نیست");for(let t of TABLES)for(let x of p.data[t]||[])await put(t,x)}else await put("files",{id:uid(),workspaceId:wid,name:f.name,content:txt});notify("فایل با موفقیت وارد شد");render()}catch(err){notify(err.message)}e.target.value=""};document.addEventListener("input",e=>{if(e.target.id==="editor"){code=e.target.value;sessionStorage.setItem("nx-code",code)}});
(async()=>{await initWorkspaces();await render()})().catch(e=>{$("#view").textContent="TAHA HESARAKI could not initialize. Reload the page.";console.error(e)});
</script>

</body></html>
